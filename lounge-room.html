<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3fbe9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RE100:SMART" />
<meta name="format-detection" content="telephone=no" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="manifest" href="manifest.json" />
<!-- 링크 공유 미리보기 (카톡·문자 등) -->
<meta name="description" content="과자봉지 화분에 채소를 키우며 마음도 돌보는 식물 친구 앱" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="RE100:SMART" />
<meta property="og:title" content="RE100:SMART · 나를 살리는 식물" />
<meta property="og:description" content="과자봉지 화분에 채소를 키우며 마음도 돌보는 식물 친구 앱 🌱" />
<meta property="og:url" content="https://team-siha.github.io/re100-smart/" />
<meta property="og:image" content="https://team-siha.github.io/re100-smart/images/icons/icon-512.png" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary" />
<link rel="icon" href="images/icons/icon-192.png" />
<link rel="apple-touch-icon" href="images/icons/icon-180.png" />
<title>RE100:SMART | 소통방</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app room-chat" id="roomChat">
  <!-- 이 방 과자 캐릭터 하나만 화면 곳곳에 패턴처럼 -->
  <div class="rc-pattern" id="snackPattern" aria-hidden="true"></div>
  <header class="rc-head">
    <a class="rc-back" href="lounge.html" aria-label="소통방 목록으로">&#8249;</a>
    <div class="rc-title"><b id="roomTitle">소통방</b> <em id="roomMembers"></em></div>
  </header>

  <!-- 이 방의 과자 하나가 테마! 침대 위로 슬로우모션 털썩 -->
  <div class="rc-stage" id="roomStage">
    <div class="rc-leaves" aria-hidden="true">
      <span style="--x:8%;--d:0s">🍃</span><span style="--x:30%;--d:2.4s">🌿</span>
      <span style="--x:70%;--d:1.2s">🍃</span><span style="--x:90%;--d:3.4s">🌱</span>
    </div>
    <div class="rc-stage-name" id="stageName"></div>
  </div>

  <main class="rc-messages" id="chatWindow"></main>
</div>
<!-- 식물 친구들이 입력창 뒤에서 하나둘씩 빼꼼 (타이핑하면 쏙 숨어요) -->
<div class="rc-peekers" id="peekers" aria-hidden="true"></div>
<div class="chat-input-row rc-input">
  <textarea id="chatInput" placeholder="이 방 친구들에게 인사해보세요..."></textarea>
  <button id="sendBtn">전송</button>
</div>

<!-- 친구 프로필 팝업 -->
<div class="profile-modal" id="profileModal">
  <div class="pm-card">
    <div class="char-box medium" id="pmChar"></div>
    <div class="pm-name" id="pmName"></div>
    <div class="pm-line" id="pmLine"></div>
    <div class="pm-mood" id="pmMood"></div>
    <button class="btn" id="pmClose">닫기</button>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/characters.js"></script>
<script src="js/lounge-room.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3fbe9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RE100:SMART" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="images/icons/icon-192.png" />
<link rel="apple-touch-icon" href="images/icons/icon-180.png" />
<title>RE100:SMART · 나를 살리는 식물</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="onboard-wrap">
  <!-- 채소 친구들이 동그랗게 모여서 반겨줘요 -->
  <div class="onboard-friends">
    <img src="images/chars/romaine.png" alt="" class="of of1" />
    <img src="images/chars/basil.png" alt="" class="of of2" />
    <img src="images/chars/cheongSangchu.png" alt="" class="of of3" />
    <img src="images/chars/mint.png" alt="" class="of of4" />
    <img src="images/chars/jeokSangchu.png" alt="" class="of of5" />
  </div>

  <div class="onboard-title">RE:100 스마트와 함께하기</div>
  <div class="onboard-sub">과자봉지 리싸이클 포대 농업 · 미니 스마트팜</div>

  <div class="onboard-card">
    <div class="ob-step">내 프로필 만들기</div>

    <div class="field">
      <label for="nicknameInput">이름 (닉네임)</label>
      <input type="text" id="nicknameInput" placeholder="예) 박시하" maxlength="12" autocomplete="off" />
    </div>
    <div class="onboard-welcome-back" id="welcomeBackBox"></div>

    <!-- 새로 시작하는 친구만 보이는 칸 -->
    <div id="newUserFields">
      <div class="ob-safe">
        🔒 아래 정보는 <b>내 또래의 친구들을 찾기 위해서</b> 적는 정보예요.<br />
        다른 곳에 쓰이지 않으니 안심하셔도 돼요 🌿
      </div>

      <div class="ob-row">
        <div class="field">
          <label for="ageInput">나이</label>
          <input type="number" id="ageInput" placeholder="예) 18" min="1" max="120" />
        </div>
        <div class="field">
          <label>성별</label>
          <div class="seg" id="genderSeg">
            <button type="button" data-v="여">여</button>
            <button type="button" data-v="남">남</button>
            <button type="button" data-v="비공개">비공개</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>오늘 상태 (다른 친구들이 알아차릴 수 있게 표시돼요)</label>
        <div class="chip-group" id="moodChips"></div>
        <div class="mood-bar-wrap">
          <div class="mood-bar-track"><div class="mood-bar-fill" id="moodBarFill"></div></div>
          <span class="mood-emoji" id="moodEmoji">🙂</span>
        </div>
        <input type="range" id="moodIntensity" min="10" max="100" value="60" style="width:100%; margin-top:8px;" />
      </div>

      <div class="field">
        <label for="snackInput">과자봉지 이름 (리싸이클한 포대에 붙일 이름)</label>
        <input type="text" id="snackInput" placeholder="예) 포스틱" maxlength="12" />
      </div>

      <div class="ob-example">예시) 박시하 / 18세 / 여 / 포스틱 / 민트(씩씩이)</div>
    </div>

    <button class="btn" id="enterBtn" style="margin-top:6px;">프로필 완성 · 식물 MBTI 하러 가기</button>

    <div class="onboard-hint">
      🌿 <b>예전에 사용했던 이름</b>을 입력하면<br />
      키우던 식물 · 포인트 · 내 방 · 대화 기록이 <b>그대로 이어져요!</b>
    </div>
    <div class="onboard-recent" id="recentBox"></div>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/welcome.js"></script>
</body>
</html>

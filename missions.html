<body>
<div class="app">
  <header class="topbar">
    <h1><span data-icon="mission" class="head-ic"></span>오늘의 미션</h1>
  </header>
  <main class="has-tabbar">
    <!-- 보유 포인트 (보상을 받으면 여기로 쏙 쌓여요) -->
    <div class="point-bank" id="pointBank">
      <span class="pb-coin">🪙</span>
      <div><small>보유 포인트</small><b id="pointUtil">0P</b></div>
    </div>

    <!-- 받을 수 있는 보상 -->
    <div class="section-title">🎁 받을 수 있는 보상 <button class="claim-all" id="claimAllBtn" type="button" style="display:none;">모두 받기</button></div>
    <div id="rewardList"></div>

    <!-- 오늘의 미션 -->
    <div class="section-title">🌱 오늘의 미션</div>
    <div id="questList"></div>

    <div class="section-title">🛒 포인트 쓰러 가기</div>
    <a class="mission-card" href="myroom.html">
      <div class="m-badge" data-icon="room"></div>
      <div class="m-text"><strong>식물의 방 꾸미기 · 영양제 받기</strong><span>200P~1500P 아이템, 실물 영양제·씨앗까지!</span></div>
      <div class="m-point">사용하기</div>
    </a>
  </main>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3fbe9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RE100:SMART" />
<meta name="format-detection" content="telephone=no" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="images/icons/icon-192.png" />
<link rel="apple-touch-icon" href="images/icons/icon-180.png" />
<title>RE100:SMART | 과자 소통방</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app talk-app">
  <!-- 과자 친구들이 빼꼼 -->
  <header class="talk-head">
    <div class="talk-peek" aria-hidden="true">
      <img src="images/chars/yangparing.webp" alt="" style="--r:-8deg" />
      <img src="images/chars/jagalchi.webp" alt="" style="--r:4deg" />
      <img src="images/chars/honeybutter.webp" alt="" style="--r:-3deg" />
      <img src="images/chars/pokachip.webp" alt="" style="--r:6deg" />
      <img src="images/chars/gamjakkang.webp" alt="" style="--r:-5deg" />
      <img src="images/chars/postick.webp" alt="" style="--r:5deg" />
      <img src="images/chars/bananakick.webp" alt="" style="--r:-6deg" />
      <img src="images/chars/concho.webp" alt="" style="--r:4deg" />
      <img src="images/chars/ggotgerang.webp" alt="" style="--r:7deg" />
    </div>
    <div class="talk-title-row">
      <h1>과자 소통방</h1>
      <button class="talk-add" id="openCreateBtn" aria-label="방 만들기">＋</button>
    </div>
    <div class="talk-filters" id="filters">
      <button class="on" data-filter="all">전체</button>
      <button data-filter="unread">안읽음 <span class="cnt" id="unreadTotal">0</span></button>
      <button data-filter="mine">내가 만든 방</button>
    </div>
  </header>

  <!-- 방 만들기 (＋ 누르면 열려요) -->
  <section class="talk-create" id="createPanel">
    <div class="field">
      <label for="newRoomName">새로운 과자 방 이름</label>
      <input type="text" id="newRoomName" placeholder="예) 꼬북칩 방" maxlength="16" />
    </div>
    <label class="tc-label">방장 과자 캐릭터 고르기</label>
    <div class="tc-chars" id="charPicker"></div>
    <button class="btn" id="createRoomBtn">방 만들기</button>
  </section>

  <main class="has-tabbar talk-list-wrap">
    <ul class="talk-list" id="roomList"></ul>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/characters.js"></script>
<script src="js/icons.js"></script>
<script src="js/tabbar.js"></script>
<script src="js/lounge.js"></script>
</body>
</html>

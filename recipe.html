<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3fbe9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RE100:SMART" />
<meta name="format-detection" content="telephone=no" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="manifest" href="manifest.json" />
<!-- 링크 공유 미리보기 (카톡·문자 등) -->
<meta name="description" content="과자봉지 화분에 채소를 키우며 마음도 돌보는 식물 친구 앱" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="RE100:SMART" />
<meta property="og:title" content="RE100:SMART · 나를 살리는 식물" />
<meta property="og:description" content="과자봉지 화분에 채소를 키우며 마음도 돌보는 식물 친구 앱 🌱" />
<meta property="og:url" content="https://team-siha.github.io/re100-smart/" />
<meta property="og:image" content="https://team-siha.github.io/re100-smart/images/icons/icon-512.png" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary" />
<link rel="icon" href="images/icons/icon-192.png" />
<link rel="apple-touch-icon" href="images/icons/icon-180.png" />
<title>RE100:SMART | 건강 레시피</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1><span data-icon="recipe" class="head-ic"></span>건강 레시피</h1>
    <p>내가 키운 채소로 만드는 가벼운 한 끼 · 메뉴를 눌러보세요</p>
  </header>
  <main class="has-tabbar">
    <div class="recipe-grid" id="recipeList"></div>
    <p class="recipe-note">※ 조리 시간과 칼로리는 재료의 양과 종류, 만드는 방법에 따라 달라질 수 있어요.</p>
  </main>
</div>

<!-- 메뉴를 누르면 아래에서 올라오는 세부 설명 -->
<div class="recipe-sheet" id="recipeSheet" role="dialog" aria-modal="true">
  <div class="rs-panel">
    <div class="rs-grab"></div>
    <div class="rs-art" id="rsArt"></div>
    <div class="rs-head">
      <div class="char-box small" id="rsChar"></div>
      <div>
        <div class="rs-plant" id="rsPlant"></div>
        <div class="rs-title" id="rsTitle"></div>
      </div>
    </div>
    <div class="rs-meta" id="rsMeta"></div>
    <div class="rs-note">※ 조리 시간과 칼로리는 재료의 양과 종류, 만드는 방법에 따라 달라질 수 있어요.</div>
    <div class="rs-label">재료</div>
    <div class="rs-ingredients" id="rsIngredients"></div>
    <div class="rs-label">만드는 법</div>
    <ol class="rs-steps" id="rsSteps"></ol>
    <button class="btn" id="rsClose" type="button">닫기</button>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/characters.js"></script>
<script src="js/icons.js"></script>
<script src="js/tabbar.js"></script>
<script src="js/recipe.js"></script>
</body>
</html>
